<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img"><title>UTM tracking</title><defs></defs><rect x="0" y="0" width="480" height="210" rx="0" fill="#efe8da" /><rect x="30" y="30" width="420" height="38" rx="8" fill="#fff" stroke="#d9d0c1" stroke-width="1" /><text x="44" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#1b1713" text-anchor="start">acme.example/?</text><text x="132" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="start">utm_source=news</text><text x="240" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#1f7a4d" text-anchor="start">&amp;utm_campaign=fall</text><text x="40" y="110" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b8176" text-anchor="start">Read once on arrival, stored with consent,</text><text x="40" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b8176" text-anchor="start">so you can tell which campaign brought a visitor.</text></svg>
