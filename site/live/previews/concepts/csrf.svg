<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img"><title>CSRF</title><defs></defs><rect x="0" y="0" width="480" height="210" rx="0" fill="#efe8da" /><rect x="14" y="14" width="224" height="182" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><rect x="14" y="14" width="224" height="30" rx="10" fill="#c2410c" /><rect x="14" y="30" width="224" height="14" rx="0" fill="#c2410c" /><text x="26" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="start">No token</text><text x="28" y="72" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">evil page posts a form</text><text x="28" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">your bank accepts it</text><rect x="252" y="14" width="224" height="182" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><rect x="252" y="14" width="224" height="30" rx="10" fill="#1f7a4d" /><rect x="252" y="30" width="224" height="14" rx="0" fill="#1f7a4d" /><text x="264" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="start">With token</text><text x="266" y="72" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">form carries a token</text><text x="266" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">server checks it</text></svg>
