<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img"><title>Liveness and readiness probes</title><defs></defs><rect x="0" y="0" width="480" height="210" rx="0" fill="#efe8da" /><rect x="14" y="14" width="224" height="182" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><rect x="14" y="14" width="224" height="30" rx="10" fill="#6b6258" /><rect x="14" y="30" width="224" height="14" rx="0" fill="#6b6258" /><text x="26" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="start">Liveness</text><text x="28" y="72" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">Is it alive?</text><text x="28" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">restart if not</text><rect x="252" y="14" width="224" height="182" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><rect x="252" y="14" width="224" height="30" rx="10" fill="#3d3a8c" /><rect x="252" y="30" width="224" height="14" rx="0" fill="#3d3a8c" /><text x="264" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="start">Readiness</text><text x="266" y="72" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">Ready for traffic?</text><text x="266" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#1b1713" text-anchor="start">hold traffic if not</text></svg>
