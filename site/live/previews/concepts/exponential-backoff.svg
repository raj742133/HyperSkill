<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img"><title>Exponential backoff</title><defs></defs><rect x="0" y="0" width="480" height="210" rx="0" fill="#efe8da" /><line x1="24" y1="120" x2="456" y2="120" stroke="#8b8176" stroke-width="2" stroke-linecap="round"/><circle cx="40" cy="120" r="8" fill="#1b1713"/><text x="40" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b1713" text-anchor="middle">try 1</text><circle cx="84" cy="120" r="8" fill="#c2410c"/><text x="84" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b1713" text-anchor="middle">try 2</text><text x="62.0" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b8176" text-anchor="middle">wait 1s</text><circle cx="150" cy="120" r="8" fill="#c2410c"/><text x="150" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b1713" text-anchor="middle">try 3</text><text x="117.0" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b8176" text-anchor="middle">wait 2s</text><circle cx="262" cy="120" r="8" fill="#c2410c"/><text x="262" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b1713" text-anchor="middle">try 4</text><text x="206.0" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b8176" text-anchor="middle">wait 4s</text><circle cx="430" cy="120" r="8" fill="#c2410c"/><text x="430" y="100" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1b1713" text-anchor="middle">try 5</text><text x="346.0" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b8176" text-anchor="middle">wait 8s</text><text x="240" y="186" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b8176" text-anchor="middle">waits double each time (plus jitter)</text></svg>
