.desk { max-width: 1240px; margin: 0 auto; padding: 26px 26px 50px; }
.book { position: relative; border-radius: 22px; padding: 28px; background: var(--noise), linear-gradient(145deg, #5b3720, #3d2314 60%, #4b2c19); background-blend-mode: multiply, normal;
  box-shadow: 0 30px 60px rgb(0 0 0 / .55), 0 4px 0 #2a170c, inset 0 2px 2px rgb(255 220 180 / .25), inset 0 -4px 10px rgb(0 0 0 / .5); }
.book::before { content: ""; position: absolute; inset: 11px; border-radius: 14px; border: 2px dashed rgb(240 200 140 / .55); pointer-events: none; }
header { display: flex; align-items: center; justify-content: space-between; padding: 4px 18px 22px; }
.brand { font: 800 2.1rem var(--serif); letter-spacing: .04em; background: linear-gradient(180deg, #f9e2a2, #c8963e 55%, #8a5f1c); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 2px 1px rgb(0 0 0 / .35); filter: drop-shadow(0 2px 0 rgb(0 0 0 / .4)); }
nav { display: flex; gap: 8px; }
nav a { font: 400 .95rem var(--type); color: #f3ddb0; text-decoration: none; padding: 7px 16px; border-radius: 6px; background: linear-gradient(180deg, #6e4328, #4a2a17); box-shadow: inset 0 1px 0 rgb(255 220 170 / .35), 0 2px 0 #24120a, 0 3px 6px rgb(0 0 0 / .4); transition: transform .12s, box-shadow .12s; }
nav a:hover { filter: brightness(1.15); }
nav a:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgb(255 220 170 / .35), 0 0 0 #24120a; }
nav a[aria-current] { background: linear-gradient(180deg, #2f1a0e, #3d2314); box-shadow: inset 0 3px 6px rgb(0 0 0 / .6); color: #ffd98a; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #7ab8ff; outline-offset: 3px; }
.pages { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; border-radius: 8px; box-shadow: 0 10px 24px rgb(0 0 0 / .5); position: relative; }
.pages::after { content: ""; position: absolute; left: calc(52.4% - 14px); top: 0; bottom: 0; width: 28px; background: linear-gradient(90deg, transparent, rgb(60 40 20 / .35) 45%, rgb(40 25 10 / .5) 50%, rgb(60 40 20 / .35) 55%, transparent); pointer-events: none; z-index: 3; }
.page { padding: 28px 32px 30px; position: relative; }
.paper { background: var(--noise), linear-gradient(180deg, #fbf3dd, var(--paper)); background-blend-mode: multiply, normal; border-radius: 8px 0 0 8px; }
.paper::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 35px, rgb(70 110 190 / .22) 35px 36px); background-position: 0 28px; pointer-events: none; border-radius: inherit; }
.paper::after { content: ""; position: absolute; left: 62px; top: 0; bottom: 0; width: 2px; background: rgb(220 70 60 / .45); }
.right { background: var(--noise), linear-gradient(160deg, #cfc7b8, #b6ad9c 55%, #c9c1b1); background-blend-mode: multiply, normal; border-radius: 0 8px 8px 0; }
small.date { font: 700 1.35rem var(--hand); color: var(--pen); display: block; margin-left: 40px; }
h1 { font: 800 clamp(2rem, 3.8vw, 3rem) / 1.05 var(--serif); margin: 2px 0 6px 40px; color: var(--ink); text-shadow: 0 1px 0 rgb(255 255 255 / .6); }
h1 span { font: 700 1.15em var(--hand); color: var(--pen); }
.sub { margin-left: 40px; font: 500 1.35rem/1.25 var(--hand); color: #3b3a55; max-width: 28ch; }
h2 { font: 600 1.05rem var(--serif); letter-spacing: .1em; text-transform: uppercase; margin: 22px 0 8px 40px; color: #7a4a1c; }
ul { list-style: none; padding: 0; margin: 0 0 0 40px; position: relative; z-index: 2; }
.habit { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 6px 0; transition: transform .2s; }
.habit:hover { transform: translateX(4px); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.habit .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--pen); border: 2px solid var(--pen); flex: none; opacity: .9; transform: rotate(-4deg); }
.habit .grow { flex: 1; }
.habit strong { display: block; font: 700 1.7rem/1 var(--hand); color: var(--pen); position: relative; width: max-content; max-width: 100%; }
.habit strong::after { content: ""; position: absolute; left: -2px; right: -2px; top: 54%; height: 3px; background: var(--pen); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.5, 0, .2, 1); opacity: .8; }
.habit[data-done] strong::after { transform: scaleX(1); }
.habit .m { font: 400 .85rem var(--type); color: #6b5b40; }
.sw { width: 74px; height: 56px; flex: none; border: 0; padding: 0; cursor: pointer; background: none; position: relative; }
.sw::before { content: ""; position: absolute; left: 4px; right: 4px; top: 22px; height: 20px; border-radius: 10px; background: linear-gradient(180deg, #1c1611, #3b3025); box-shadow: inset 0 3px 5px rgb(0 0 0 / .8), 0 1px 0 rgb(255 255 255 / .6); }
.sw::after { content: ""; position: absolute; left: 6px; top: 14px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c9, var(--brass) 45%, var(--brass-d)); box-shadow: 0 5px 8px rgb(0 0 0 / .55), inset 0 -3px 4px rgb(80 40 0 / .55), inset 0 2px 2px rgb(255 255 255 / .7); transition: transform .28s cubic-bezier(.4, 1.4, .5, 1); }
.sw[aria-checked=true]::after { transform: translateX(28px); }
.led { position: absolute; right: 2px; top: 0; width: 11px; height: 11px; border-radius: 50%; background: #1b3a26; box-shadow: inset 0 1px 2px rgb(0 0 0 / .8), 0 1px 0 rgb(255 255 255 / .6); transition: background .2s, box-shadow .3s; }
.habit[data-done] .led { background: var(--led); box-shadow: 0 0 10px 2px rgb(85 240 139 / .8), inset 0 -2px 3px rgb(0 100 40 / .6); }
.habit.new { animation: stamp .45s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes stamp { from { opacity: 0; transform: scale(1.4) rotate(-6deg); } }
.panel-t { font: 600 1rem var(--serif); letter-spacing: .12em; text-transform: uppercase; color: #4a3a22; text-shadow: 0 1px 0 rgb(255 255 255 / .7); margin-bottom: 12px; }
.gaugebox { display: grid; place-items: center; margin-bottom: 14px; }
.gauge { width: 270px; height: 160px; position: relative; border-radius: 135px 135px 14px 14px; background: radial-gradient(circle at 50% 100%, #fffbe9 0, #f0e2b4 70%, #d8c48a); box-shadow: inset 0 4px 10px rgb(0 0 0 / .45), 0 0 0 7px var(--brass), 0 0 0 9px var(--brass-d), 0 8px 14px rgb(0 0 0 / .45); overflow: hidden; }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.needle { position: absolute; left: 50%; bottom: 14px; width: 4px; height: 118px; margin-left: -2px; background: linear-gradient(180deg, #b3261e, #7c140f); transform-origin: 50% 100%; transform: rotate(calc(-80deg + var(--p) * 160deg)); transition: transform 1.1s cubic-bezier(.3, 1.5, .5, 1); border-radius: 2px; box-shadow: 2px 2px 3px rgb(0 0 0 / .4); }
.hub { position: absolute; left: 50%; bottom: 4px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c9, var(--brass) 50%, var(--brass-d)); box-shadow: 0 2px 4px rgb(0 0 0 / .5); }
.readout { text-align: center; font: 400 1rem var(--type); margin-top: 12px; color: #3a2d1a; }
.readout b { font: 800 1.7rem var(--serif); }
.chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 12px 14px 8px; border-radius: 8px; background: linear-gradient(180deg, #2a2a2e, #3a3a40); box-shadow: inset 0 4px 10px rgb(0 0 0 / .7), 0 1px 0 rgb(255 255 255 / .6); }
.chart div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; font: 400 .72rem var(--type); color: #d8c48a; gap: 4px; }
.chart i { display: block; height: var(--h); border-radius: 3px; background: repeating-linear-gradient(180deg, #ffb347 0 6px, #7a4a14 6px 8px); box-shadow: 0 0 8px rgb(255 160 40 / .45); transform-origin: bottom; animation: seg .9s steps(9) backwards; }
.chart div:last-child i { background: repeating-linear-gradient(180deg, var(--led) 0 6px, #17512c 6px 8px); box-shadow: 0 0 8px rgb(85 240 139 / .5); }
@keyframes seg { from { transform: scaleY(0); } }
form { display: grid; gap: 12px; margin-top: 18px; }
label { display: grid; gap: 4px; font: 400 .85rem var(--type); text-transform: uppercase; letter-spacing: .1em; color: #3a2d1a; text-shadow: 0 1px 0 rgb(255 255 255 / .7); }
input, select { font: 500 1.35rem var(--hand); color: var(--pen); background: linear-gradient(180deg, #e9dfc4, #f7efd8); border: 0; border-radius: 6px; padding: 8px 12px; box-shadow: inset 0 3px 6px rgb(60 40 10 / .45), 0 1px 0 rgb(255 255 255 / .7); }
input::placeholder { color: #7a7058; }
input:focus { box-shadow: inset 0 3px 6px rgb(60 40 10 / .45), 0 0 0 3px #7ab8ff; outline: none; }
.btn { font: 400 1.05rem var(--type); letter-spacing: .08em; text-transform: uppercase; color: #3a230a; border: 0; border-radius: 10px; padding: 14px 18px; cursor: pointer; background: linear-gradient(180deg, #ffe7a8, var(--brass) 50%, var(--brass-d)); box-shadow: inset 0 2px 1px rgb(255 255 255 / .8), inset 0 -3px 3px rgb(90 50 0 / .5), 0 6px 0 #6d4710, 0 10px 14px rgb(0 0 0 / .5); text-shadow: 0 1px 0 rgb(255 255 255 / .6); transition: transform .08s, box-shadow .08s; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(5px); box-shadow: inset 0 2px 1px rgb(255 255 255 / .8), inset 0 -3px 3px rgb(90 50 0 / .5), 0 1px 0 #6d4710, 0 3px 6px rgb(0 0 0 / .5); }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 40px) rotate(-1deg); opacity: 0; background: linear-gradient(180deg, #fff6c8, #f1df9a); color: #4a3a12; font: 700 1.45rem var(--hand); padding: 10px 26px; box-shadow: 0 8px 18px rgb(0 0 0 / .5); transition: .4s cubic-bezier(.3, 1.5, .5, 1); pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }
@media (max-width: 900px) { .pages { grid-template-columns: 1fr; } .pages::after { display: none; } .paper, .right { border-radius: 8px; } nav { display: none; } .desk { padding: 12px; } .book { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11Z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.4-1.8-1-2.6 3 1 5 3.6 5 6.6a7 7 0 0 1-14 0C5 7 12 7 12 2Z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>
<div class="desk">
 <div class="book">
  <header>
    <div class="brand">Daybreak</div>
    <nav aria-label="Main"><a href="#" aria-current="page">Today</a><a href="#">Habits</a><a href="#">Stats</a><a href="#">Settings</a></nav>
  </header>
  <div class="pages">
    <section class="page paper" aria-labelledby="h">
      <small class="date">Saturday, 24 October</small>
      <h1 id="h">Good morning, <span>Pratyush</span></h1>
      <p class="sub">Small things, done daily, add up. 12 days in a row!</p>
      <h2>Today</h2>
      <ul id="habits">
        <li class="habit" data-demo="card"><span class="ic" aria-hidden="true"><svg class="ico"><use href="#i-drop"/></svg></span><div class="grow"><strong>Drink water</strong><span class="m">6 of 8 glasses</span></div><span style="position:relative"><button class="sw" role="switch" aria-checked="false" aria-label="Drink water"></button><i class="led"></i></span></li>
        <li class="habit"><span class="ic" aria-hidden="true"><svg class="ico"><use href="#i-book"/></svg></span><div class="grow"><strong>Read 20 pages</strong><span class="m">The Overstory, ch. 4</span></div><span style="position:relative"><button class="sw" role="switch" aria-checked="false" aria-label="Read 20 pages" data-demo="toggle"></button><i class="led"></i></span></li>
        <li class="habit"><span class="ic" aria-hidden="true"><svg class="ico"><use href="#i-moon"/></svg></span><div class="grow"><strong>Evening walk</strong><span class="m">30 min, before sunset</span></div><span style="position:relative"><button class="sw" role="switch" aria-checked="false" aria-label="Evening walk"></button><i class="led"></i></span></li>
      </ul>
    </section>
    <section class="page right" aria-label="Instruments">
      <div class="panel-t">Progress today</div>
      <div class="gaugebox"><div class="gauge" role="img" aria-label="Progress today">
        <svg viewBox="0 0 270 160" aria-hidden="true"><g stroke="#3a2d1a" stroke-width="2" fill="none"><path d="M26 140 A109 109 0 0 1 244 140" opacity=".35"/></g>
          <g stroke="#3a2d1a" stroke-width="2.4"><line x1="38" y1="130" x2="52" y2="124"/><line x1="58" y1="84" x2="71" y2="92"/><line x1="105" y1="46" x2="111" y2="60"/><line x1="165" y1="46" x2="159" y2="60"/><line x1="212" y1="84" x2="199" y2="92"/><line x1="232" y1="130" x2="218" y2="124"/></g>
          <g font-family="Special Elite, monospace" font-size="13" fill="#3a2d1a" text-anchor="middle"><text x="38" y="150">0</text><text x="135" y="36">50</text><text x="232" y="150">100</text></g></svg>
        <div class="needle"></div><div class="hub"></div></div></div>
      <div class="readout"><b data-pct>0%</b> · <span data-count>0</span> of <span data-total>3</span> done</div>
      <div class="panel-t" style="margin-top:20px">This week</div>
      <div class="chart" role="img" aria-label="Habits done per day: Monday 5, Tuesday 6, Wednesday 4, Thursday 7, Friday 6, Saturday 3 so far">
        <div style="--h:62%"><i></i>M</div><div style="--h:76%"><i></i>T</div><div style="--h:50%"><i></i>W</div><div style="--h:90%"><i></i>T</div><div style="--h:76%"><i></i>F</div><div style="--h:38%"><i></i>S</div>
      </div>
      <form id="add-form" autocomplete="off">
        <label>New habit<input id="add-input" data-demo="input" placeholder="Stretch for 5 minutes"></label>
        <label>How often<select><option>Every day</option><option>Weekdays</option><option>3 times a week</option></select></label>
        <button class="btn" data-demo="add">Add habit</button>
      </form>
    </section>
  </div>
 </div>
</div>
<div id="toast" role="status"></div>
<template id="tpl"><li class="habit"><span class="ic" aria-hidden="true"><svg class="ico"><use href="#i-spark"/></svg></span><div class="grow"><strong data-name></strong><span class="m">Every day</span></div><span style="position:relative"><button class="sw" role="switch" aria-checked="false"></button><i class="led"></i></span></li></template>
<script>/* Shared behaviour for the ten style demos: switches, adding a habit, the toast, and the progress variable. No network, no storage. */
(function () {
  var habits = document.getElementById("habits");
  function update() {
    var all = habits.querySelectorAll(".habit"), done = habits.querySelectorAll(".habit[data-done]");
    document.documentElement.style.setProperty("--p", all.length ? done.length / all.length : 0);
    document.querySelectorAll("[data-count]").forEach(function (n) { n.textContent = done.length; });
    document.querySelectorAll("[data-total]").forEach(function (n) { n.textContent = all.length; });
    document.querySelectorAll("[data-pct]").forEach(function (n) { n.textContent = Math.round(100 * (all.length ? done.length / all.length : 0)) + "%"; });
  }
  document.addEventListener("click", function (e) {
    var sw = e.target.closest("[role=switch]");
    if (!sw) return;
    var on = sw.getAttribute("aria-checked") !== "true";
    sw.setAttribute("aria-checked", String(on));
    var h = sw.closest(".habit");
    if (h) h.toggleAttribute("data-done", on);
    update();
  });
  var toast = document.getElementById("toast"), timer;
  function say(t) { toast.textContent = t; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(function () { toast.classList.remove("show"); }, 2400); }
  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("add-input"), name = input.value.trim();
    if (!name) { input.focus(); return; }
    var li = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
    li.querySelectorAll("[data-name]").forEach(function (n) { n.textContent = name; });
    li.querySelectorAll("[role=switch]").forEach(function (n) { n.setAttribute("aria-label", name); });
    li.classList.add("new");
    habits.appendChild(li);
    input.value = "";
    say("Habit added: " + name);
    update();
  });
  update();
})();
</script>
