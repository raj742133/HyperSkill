<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 252" width="480" height="252" role="img"><title>em-dashes-in-copy: avoid (left) and instead (right)</title><defs></defs><rect x="0" y="0" width="480" height="252" rx="0" fill="#efe8da" /><rect x="14" y="8" width="50.0" height="18" rx="9" fill="#c2410c" /><text x="21" y="21" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.06em">AVOID</text><rect x="250" y="8" width="64.4" height="18" rx="9" fill="#1f7a4d" /><text x="257" y="21" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0.06em">INSTEAD</text><rect x="10" y="34" width="225" height="188" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><text x="24" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1713" text-anchor="start">Fast — simple —</text><text x="24" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1713" text-anchor="start">powerful — yours.</text><rect x="24" y="146" width="190" height="7" rx="3" fill="#d9d0c1" /><rect x="245" y="34" width="225" height="188" rx="10" fill="#fffdf8" stroke="#d9d0c1" stroke-width="1.4" /><text x="259" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1713" text-anchor="start">It loads fast and</text><text x="259" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1713" text-anchor="start">you can edit it.</text><rect x="259" y="146" width="190" height="7" rx="3" fill="#d9d0c1" /