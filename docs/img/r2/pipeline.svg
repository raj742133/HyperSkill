<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
<title id="t">The nine HyperSkill phases</title>
<desc id="d">Research, plan, foundation, product, ship, harden, operate, launch and scale. Each phase ends at a gate that needs evidence before the next phase starts.</desc>
<rect width="1000" height="250" fill="#fff8e1"/>
<style>text{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#000}.n{font-size:12px;font-weight:700}.t{font-size:13px;font-weight:700}.g{font-size:10.5px}.s{font-size:15px;font-weight:700}</style>
<text class="s" x="28" y="36">IDEA</text>
<text class="s" x="972" y="36" text-anchor="end">SHIPPED, MONITORED, PROMOTED</text>
<rect x="32.0" y="64" width="97.8" height="110" fill="#000"/>
<rect x="28.0" y="60" width="97.8" height="110" fill="#ffe14d" stroke="#000" stroke-width="3"/>
<text class="n" x="38.0" y="84" style="fill:#000">0</text>
<text class="t" x="38.0" y="112" style="fill:#000">research</text>
<text class="g" x="38.0" y="136" style="fill:#000">5 checks</text>
<text class="g" x="38.0" y="154" style="fill:#000">hs-research</text>
<rect x="137.8" y="64" width="97.8" height="110" fill="#000"/>
<rect x="133.8" y="60" width="97.8" height="110" fill="#ff4fa3" stroke="#000" stroke-width="3"/>
<text class="n" x="143.8" y="84" style="fill:#000">1</text>
<text class="t" x="143.8" y="112" style="fill:#000">plan</text>
<text class="g" x="143.8" y="136" style="fill:#000">9 checks</text>
<text class="g" x="143.8" y="154" style="fill:#000">hs-plan</text>
<rect x="243.6" y="64" width="97.8" height="110" fill="#000"/>
<rect x="239.6" y="60" width="97.8" height="110" fill="#b6ff3b" stroke="#000" stroke-width="3"/>
<text class="n" x="249.6" y="84" style="fill:#000">2</text>
<text class="t" x="249.6" y="112" style="fill:#000">foundation</text>
<text class="g" x="249.6" y="136" style="fill:#000">11 checks</text>
<text class="g" x="249.6" y="154" style="fill:#000">hs-foundation</text>
<rect x="349.3" y="64" width="97.8" height="110" fill="#000"/>
<rect x="345.3" y="60" width="97.8" height="110" fill="#3b5bff" stroke="#000" stroke-width="3"/>
<text class="n" x="355.3" y="84" style="fill:#fff">3</text>
<text class="t" x="355.3" y="112" style="fill:#fff">product</text>
<text class="g" x="355.3" y="136" style="fill:#fff">9 checks</text>
<text class="g" x="355.3" y="154" style="fill:#fff">hs-product</text>
<rect x="455.1" y="64" width="97.8" height="110" fill="#000"/>
<rect x="451.1" y="60" width="97.8" height="110" fill="#ffe14d" stroke="#000" stroke-width="3"/>
<text class="n" x="461.1" y="84" style="fill:#000">4</text>
<text class="t" x="461.1" y="112" style="fill:#000">ship</text>
<text class="g" x="461.1" y="136" style="fill:#000">11 checks</text>
<text class="g" x="461.1" y="154" style="fill:#000">hs-ship</text>
<rect x="560.9" y="64" width="97.8" height="110" fill="#000"/>
<rect x="556.9" y="60" width="97.8" height="110" fill="#ff4fa3" stroke="#000" stroke-width="3"/>
<text class="n" x="566.9" y="84" style="fill:#000">5</text>
<text class="t" x="566.9" y="112" style="fill:#000">harden</text>
<text class="g" x="566.9" y="136" style="fill:#000">10 checks</text>
<text class="g" x="566.9" y="154" style="fill:#000">hs-harden</text>
<rect x="666.7" y="64" width="97.8" height="110" fill="#000"/>
<rect x="662.7" y="60" width="97.8" height="110" fill="#b6ff3b" stroke="#000" stroke-width="3"/>
<text class="n" x="672.7" y="84" style="fill:#000">6</text>
<text class="t" x="672.7" y="112" style="fill:#000">operate</text>
<text class="g" x="672.7" y="136" style="fill:#000">8 checks</text>
<text class="g" x="672.7" y="154" style="fill:#000">hs-operate</text>
<rect x="772.4" y="64" width="97.8" height="110" fill="#000"/>
<rect x="768.4" y="60" width="97.8" height="110" fill="#3b5bff" stroke="#000" stroke-width="3"/>
<text class="n" x="778.4" y="84" style="fill:#fff">7</text>
<text class="t" x="778.4" y="112" style="fill:#fff">launch</text>
<text class="g" x="778.4" y="136" style="fill:#fff">5 checks</text>
<text class="g" x="778.4" y="154" style="fill:#fff">hs-launch</text>
<rect x="878.2" y="64" width="97.8" height="110" fill="#000"/>
<rect x="874.2" y="60" width="97.8" height="110" fill="#ffe14d" stroke="#000" stroke-width="3"/>
<text class="n" x="884.2" y="84" style="fill:#000">8</text>
<text class="t" x="884.2" y="112" style="fill:#000">scale</text>
<text class="g" x="884.2" y="136" style="fill:#000">4 checks</text>
<text class="g" x="884.2" y="154" style="fill:#000">hs-scale</text>
<text class="s" x="28" y="208">&#9670; BETWEEN PHASES SITS A GATE. EVERY CHECK NEEDS EVIDENCE OR A WRITTEN REASON TO WAIVE IT.</text>
<text class="g" x="28" y="230">72 checks in all. `hyperskill advance` refuses while any check is open.</text>
</svg>
